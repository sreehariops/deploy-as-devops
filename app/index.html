<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskboard</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 36rem; margin: 3rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; margin-bottom: 1rem; }
    input[type=text] { flex: 1; padding: .5rem; }
    li { display: flex; align-items: center; gap: .5rem; padding: .35rem 0; }
    li.done span { text-decoration: line-through; color: #888; }
    li span { flex: 1; }
    footer { margin-top: 2rem; color: #888; font-size: .85rem; }
  </style>
</head>
<body>
  <h1>Taskboard</h1>
  <form id="new">
    <input type="text" id="title" placeholder="What needs doing?" maxlength="200" required>
    <button>Add</button>
  </form>
  <ul id="tasks"></ul>
  <footer id="version"></footer>

  <script>
    const list = document.getElementById("tasks");

    async function api(method, path, body) {
      const res = await fetch(path, {
        method,
        headers: { "Content-Type": "application/json" },
        body: body && JSON.stringify(body),
      });
      if (!res.ok) throw new Error(`${method} ${path}: ${res.status}`);
      return res.status === 204 ? null : res.json();
    }

    async function refresh() {
      const tasks = await api("GET", "/api/tasks");
      list.replaceChildren(...tasks.map(t => {
        const li = document.createElement("li");
        li.className = t.done ? "done" : "";
        const box = Object.assign(document.createElement("input"), { type: "checkbox", checked: t.done });
        box.onchange = () => api("PATCH", `/api/tasks/${t.id}`, { done: box.checked }).then(refresh);
        const label = Object.assign(document.createElement("span"), { textContent: t.title });
        const del = Object.assign(document.createElement("button"), { textContent: "Delete" });
        del.onclick = () => api("DELETE", `/api/tasks/${t.id}`).then(refresh);
        li.append(box, label, del);
        return li;
      }));
    }

    document.getElementById("new").onsubmit = async e => {
      e.preventDefault();
      const input = document.getElementById("title");
      await api("POST", "/api/tasks", { title: input.value });
      input.value = "";
      refresh();
    };

    api("GET", "/healthz").then(h => document.getElementById("version").textContent = `version ${h.version}`);
    refresh();
  </script>
</body>
</html>
